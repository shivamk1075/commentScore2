[project]
name = "commentscore"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shivam Kumar", email = "shivam.kumar.101075@gmail.com" }
]
requires-python = "==3.11.*"
dependencies = [
    "google-api-python-client>=2.199.0",
    "joblib>=1.5.3",
    "matplotlib>=3.11.1",
    "nltk>=3.10.3",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scikit-learn==1.6.1",
    "seaborn>=0.13.2",
    "streamlit>=1.62.0",
    "wordcloud>=1.9.6",
]

[project.scripts]
commentscore = "commentscore:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
